<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light dark}body{margin:0}</style></head><body><title>Atelier Découpage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Concept : table de montage d'un petit studio. Scène en haut, réglages dessous, la couleur du renard (orange) pour l'action, le bleu de son sweat pour la sélection. */
:root{
  --bg:#eceff4; --panel:#ffffff; --panel2:#f4f6fa; --line:#d6dbe5; --fg:#1a1f2e; --muted:#5f677c;
  --accent:#e66f12; --accent-fg:#ffffff; --sel:#2c6ed0; --sel-bg:#e3edfb; --danger:#c8403f; --ok:#2a9456;
  --stage-bg:#0d0f15;
  --font-d:'Baloo 2',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --font-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141b; --panel:#1b1e28; --panel2:#232735; --line:#323748; --fg:#eceef5; --muted:#9aa1b6;
  --accent:#ff8f33; --accent-fg:#1a1006; --sel:#6aa4ff; --sel-bg:#1e2c47; --danger:#ff7270; --ok:#58cf8a;
  --stage-bg:#07080c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141b; --panel:#1b1e28; --panel2:#232735; --line:#323748; --fg:#eceef5; --muted:#9aa1b6;
  --accent:#ff8f33; --accent-fg:#1a1006; --sel:#6aa4ff; --sel-bg:#1e2c47; --danger:#ff7270; --ok:#58cf8a;
  --stage-bg:#07080c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.4;
  padding-block:10px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-d);margin:0;font-weight:700;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:1.45rem;letter-spacing:.2px;white-space:nowrap}
.brand span{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.stage-col{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-bottom:8px}
.stagewrap{position:relative;border-radius:12px;overflow:hidden;background:var(--stage-bg);box-shadow:0 2px 10px rgba(0,0,0,.18);aspect-ratio:16/9;width:100%}
#stage{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
.transport{display:flex;align-items:center;gap:8px;margin-top:8px}
.tbtn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.tbtn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);width:48px;height:48px}
.tbtn svg{width:20px;height:20px;fill:currentColor}
#scrub{flex:1;min-width:0;accent-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted);flex:none;min-width:5.6em;text-align:right}
.status{min-height:1.3em;font-size:.82rem;color:var(--muted);margin-top:4px}
.epbar{display:flex;gap:8px;align-items:center;padding:2px 0 4px}.epbar select{flex:1;min-width:0}
.strip{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:.85rem;white-space:nowrap}
.chip b{font-family:var(--font-d);color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-bg);color:var(--fg)}
.chip.add{border-style:dashed;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel2);border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:11px 4px;font-family:var(--font-d);font-weight:500;font-size:.98rem;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);background:var(--panel)}
.tabbody{padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span,.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
input[type=text],input[type=number],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 10px;font-size:16px}
textarea{resize:vertical;min-height:58px}
input[type=range]{width:100%;accent-color:var(--accent)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 14px;font-weight:700;font-size:.9rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:default}
.card{border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.sel{border-color:var(--sel)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bgs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bgb{border:2px solid var(--line);border-radius:9px;padding:0;overflow:hidden;background:none;aspect-ratio:16/9}
.bgb img{display:block;width:100%;height:100%;object-fit:cover}
.bgb[aria-pressed="true"]{border-color:var(--sel)}
.bgn{font-size:.74rem;text-align:center;color:var(--muted)}
.actors{display:flex;gap:8px;flex-wrap:wrap}
.actor{display:flex;flex-direction:column;align-items:center;gap:2px;width:72px;border:2px solid var(--line);background:var(--panel2);border-radius:10px;padding:4px;font-size:.7rem;color:var(--muted)}
.actor img{height:52px;max-width:100%;object-fit:contain}
.actor b{font-family:var(--font-d);font-size:.78rem;color:var(--fg);line-height:1.1}
.actor[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-bg);color:var(--fg)}
.libgroup h3{font-size:1rem;margin-bottom:6px}
.libgrid{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.libitem{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:5px;font-size:.7rem;color:var(--muted)}
.libitem img{height:64px;max-width:100%;object-fit:contain}
.libitem:active{transform:scale(.96)}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.who{font-weight:700}
.line-top{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}
.audio{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.audio .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.pend{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pend .card img{height:80px;object-fit:contain;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 50%/14px 14px;border-radius:8px}
.hide{display:none!important}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:10px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<header class="top">
  <div class="brand"><h1>Atelier Découpage</h1><span>Persos, décors, voix, vidéo</span></div>
  <button class="btn primary" id="btnTopExport" type="button">Exporter</button>
</header>

<div class="app">
  <section class="stage-col" aria-label="Aperçu">
    <div class="stagewrap"><canvas id="stage" width="1280" height="720" aria-label="Scène"></canvas></div>
    <div class="transport">
      <button class="tbtn" id="btnRestart" type="button" aria-label="Revenir au début"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button class="tbtn main" id="btnPlay" type="button" aria-label="Lecture"></button>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position dans l'épisode">
      <div class="time" id="time">0:00.0</div>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="epbar" id="epbar"></div>
    <div class="strip" id="strip"></div>
  </section>

  <section class="panel" aria-label="Réglages">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="scene" id="tab-scene" type="button">Scène</button>
      <button class="tab" role="tab" data-tab="actors" id="tab-actors" type="button">Acteurs</button>
      <button class="tab" role="tab" data-tab="voices" id="tab-voices" type="button">Voix</button>
      <button class="tab" role="tab" data-tab="lib" id="tab-lib" type="button">Biblio</button>
      <button class="tab" role="tab" data-tab="export" id="tab-export" type="button">Export</button>
    </div>
    <div class="tabbody" id="body" role="tabpanel"></div>
  </section>
</div>
<input type="file" id="fileSheets" accept="image/*" multiple class="hide">
<input type="file" id="fileAudioMulti" accept="audio/*" multiple class="hide">
<input type="file" id="fileAudioOne" accept="audio/*" class="hide">

function el(tag,props,...kids){
  const e=document.createElement(tag);
  for(const k in props||{}){const v=props[k];
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}

function composite(bodyId,expr){

  const mk=document.createElement('canvas');mk.width=t.width;mk.height=t.height;const mc=mk.getContext('2d');
  const g=mc.createLinearGradient(0,cutY-8,0,cutY);g.addColorStop(0,'#000');g.addColorStop(1,'rgba(0,0,0,0)');

  tc.globalCompositeOperation='destination-in';tc.drawImage(mk,0,0);
  c.drawImage(t,0,0);

}

const lineDur=l=>l.audio&&l.audio.dur?l.audio.dur:Math.max(1.2,(l.text||'').length*.062+.6);
function autoTimes(s){let t=.7;for(const l of s.lines){l.t=+t.toFixed(2);t+=lineDur(l)+.35;}}
function sceneDur(s){let e=0;for(const l of s.lines)e=Math.max(e,l.t+lineDur(l));return Math.max(+s.dur||0,e+.6,1.5);}
const startsOf=()=>{let t=0;return P.scenes.map(s=>{const o=t;t+=sceneDur(s);return o;});};
const totalDur=()=>P.scenes.reduce((a,s)=>a+sceneDur(s),0);
function locate(t){const st=startsOf();for(let i=P.scenes.length-1;i>=0;i--)if(t>=st[i])return{i,lt:t-st[i],st:st[i]};return{i:0,lt:0,st:0};}
function restLocal(s){
  let m=0;for(const a of s.actors)for(const c of a.acts)if(!['bounce','shake','wobble','jump'].includes(c.type))m=Math.max(m,c.t+c.d);
  return clamp(Math.max(m,.4),0,sceneDur(s)-.05);
}

const groupOf=id=>SPR[id]?SPR[id].group:id.split('/')[0];
function walkFx(st,x0,x1,lt,d,p,done,run){
  if(done){st.x=x1;return;}
  st.x=lerp(x0,x1,p);
  const g=groupOf(st.spr),wid=g+(run&&SPR[g+'/court']?'/court':'/marche'),f=run?5:3;
  st.oy-=Math.abs(Math.sin(lt*Math.PI*f))*(run?20:12);

}
function stateAt(a,t){
  const st={x:a.x,y:a.y,s:a.s,flip:!!a.flip,spr:a.spr,expr:a.expr||'',alpha:1,rot:0,ox:0,oy:0,sx:1,sy:1};
  const acts=a.acts.slice().sort((p,q)=>p.t-q.t);
  const en=acts.find(c=>c.type==='enter');if(en)st.x=en.side==='right'?W+300:-300;
  if(acts.some(c=>c.type==='fadein'))st.alpha=0;
  for(const c of acts){
    const d=Math.max(.05,+c.d||1),lt=t-c.t;if(lt<0)continue;
    const lp=clamp(lt/d,0,1),p=ease(lp),done=lt>=d;
    switch(c.type){
      case'enter':walkFx(st,st.x,a.x,lt,d,p,done,false);break;
      case'walk':walkFx(st,st.x,+c.x,lt,d,p,done,false);break;
      case'run':walkFx(st,st.x,+c.x,lt,d,p,done,true);break;
      case'exit':walkFx(st,st.x,c.side==='right'?W+300:-300,lt,d,p,done,false);break;
      case'glide':{const x0=st.x,y0=st.y;st.x=done?+c.x:lerp(x0,+c.x,p);st.y=done?+c.y:lerp(y0,+c.y,p);break;}
      case'jump':if(!done){st.oy-=(+c.h||120)*4*lp*(1-lp);const q=Math.sin(lp*Math.PI);st.sy*=1+.06*q;st.sx*=1-.04*q;}break;
      case'bounce':if(!done){const n=Math.max(1,Math.round(d*2.5)),q=Math.abs(Math.sin(lp*Math.PI*n))*(1-.25*lp);st.sy*=1+.07*q;st.sx*=1-.045*q;}break;
      case'shake':if(!done)st.ox+=Math.sin(lt*45)*9*(1-lp);break;
      case'wobble':if(!done)st.rot+=Math.sin(lt*9)*.07;break;
      case'swap':st.spr=c.spr||st.spr;break;
      case'expr':st.expr=c.expr||'';break;
      case'fadein':st.alpha=done?1:p;break;
      case'fadeout':st.alpha=done?0:1-p;break;
      case'zoom':st.s=done?+c.s:lerp(st.s,+c.s,p);break;
    }

  return st;
}

  const sp=SPR[st.spr];if(!sp)return null;
  const h=dispH(st.spr,st.s)*st.sy,w=h*(sp.w/sp.h)*(st.sx/st.sy);

function wrapText(text,maxW,firstW){
  const words=text.split(/\s+/),lines=[];let cur='';
  for(const w of words){const test=cur?cur+' '+w:w,lim=lines.length?maxW:firstW;if(cx.measureText(test).width>lim&&cur){lines.push(cur);cur=w;}else cur=test;}

let AC=null,live=[];
function ensureAudio(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function stopAudio(){for(const s of live){try{s.stop();}catch(e){}}live=[];}
function scheduleAudio(from,dest){
  stopAudio();if(!AC)return;
  const st=startsOf();
  P.scenes.forEach((s,i)=>s.lines.forEach(l=>{
    if(!l.audio||!l.audio.buf)return;
    const ls=st[i]+l.t,end=ls+l.audio.buf.duration;if(end<=from)return;
    const src=AC.createBufferSource();src.buffer=l.audio.buf;src.connect(dest);
    src.start(AC.currentTime+Math.max(0,ls-from),Math.max(0,from-ls));live.push(src);
  }));
  P.scenes.forEach((s,i)=>(s.sfx||[]).forEach(x=>{
    if(!x.audio||!x.audio.buf)return;
    const ls=st[i]+x.t,end=ls+x.audio.buf.duration;if(end<=from)return;
    const src=AC.createBufferSource(),g=AC.createGain();g.gain.value=x.vol==null?.6:x.vol;
    src.buffer=x.audio.buf;src.connect(g);g.connect(dest);
    src.start(AC.currentTime+Math.max(0,ls-from),Math.max(0,from-ls));live.push(src);
  }));
}
async function loadAudioFile(file){
  const ab=await file.arrayBuffer();ensureAudio();

}

function play(from,to,dest){
  if(UI.playing)return;
  ensureAudio();
  const end=to==null?totalDur():to;
  UI.t=from==null?(UI.t>=totalDur()-.05?0:UI.t):from;
  UI.playing=true;UI.endAt=end;T0=performance.now()/1000-UI.t;
  if(AC)scheduleAudio(UI.t,dest||AC.destination);
  setPlayIcon();
  const tick=()=>{
    if(!UI.playing)return;
    UI.t=performance.now()/1000-T0;
    if(UI.t>=UI.endAt){UI.t=UI.endAt;pause();if(UI.onEnd)UI.onEnd();return;}
    const loc=locate(UI.t);if(loc.i!==UI.scene){UI.scene=loc.i;onSceneChanged();}
    renderAt(UI.t);updateTransport();rafId=requestAnimationFrame(tick);
  };
  rafId=requestAnimationFrame(tick);
}

const IDB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('atelier-decoupage',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
};
const serAudio=a=>a?{name:a.name,ab:a.ab,dur:a.dur}:null;
const serScenes=sc=>sc.map(s=>({...s,lines:s.lines.map(l=>({...l,audio:serAudio(l.audio)})),sfx:(s.sfx||[]).map(x=>({...x,audio:serAudio(x.audio)}))}));
function serialize(){
  return{v:2,ex:1,seeded:SEEDED,cur:P.eid,custom:P.custom,voices:P.voices||{},episodes:allEps().map(e=>({id:e.id,name:e.name,scenes:serScenes(e.scenes)}))};
}
let saveTimer=0;
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{await IDB.set('project2',serialize());}catch(e){}},700);}
function decodeAll(eps){
  for(const e of eps)for(const s of e.scenes)for(const l of [...s.lines,...(s.sfx||[])])if(l.audio&&l.audio.ab){
    const a=l.audio;ensureAudio();
    AC.decodeAudioData(a.ab.slice(0)).then(b=>{a.buf=b;}).catch(()=>{l.audio=null;});
  }
}
async function restore(){
  try{
    const s2=await IDB.get('project2');
    if(s2&&s2.v===2&&s2.episodes&&s2.episodes.length){
      for(const id in s2.custom||{}){const c=s2.custom[id];addSprite(id,c.src,c.w,c.h,{custom:true,k:c.k||1,base:c.base});}
      SEEDED=s2.seeded||[];
      EPS=s2.episodes.map(e=>({id:e.id,name:e.name,scenes:e.scenes}));
      const cur=EPS.find(e=>e.id===s2.cur)||EPS[0];
      P={v:1,eid:cur.id,name:cur.name,scenes:cur.scenes,custom:s2.custom||{},voices:s2.voices||{}};
      decodeAll(EPS);
      return true;
    }
    const saved=await IDB.get('project');
    if(saved&&saved.v===1&&saved.scenes&&saved.scenes.length){
      for(const id in saved.custom||{}){const c=saved.custom[id];addSprite(id,c.src,c.w,c.h,{custom:true,k:c.k||1,base:c.base});}
      P={v:1,eid:uid(),name:'Épisode 1 · Le cerf-volant',scenes:saved.scenes,custom:saved.custom||{},voices:saved.voices||{}};
      if(!saved.ex){ /* ancien épisode : on y ajoute les expressions de base */
        const D=defaultProject();
        D.scenes.forEach((ds,i)=>{const ss=P.scenes[i];if(!ss||ss.name!==ds.name)return;
          ds.actors.forEach((da,j)=>{const sa=ss.actors[j];if(!sa||sa.spr!==da.spr)return;
            da.acts.filter(c=>c.type==='expr').forEach(c=>sa.acts.push({...c,id:uid()}));});});
      }
      EPS=[{id:P.eid}];decodeAll([{scenes:P.scenes}]);
      return true;
    }
  }catch(e){}
  return false;
}

/* ================= Interface ================= */
function setTab(t){UI.tab=t;renderPanels();}
function onSceneChanged(){UI.actorId=null;renderStrip();if(UI.tab!=='lib'&&UI.tab!=='export')renderBody();}
function changed(quiet){scheduleSave();draw();if(!quiet){renderStrip();}}
function selectScene(i){
  pause();UI.scene=clamp(i,0,P.scenes.length-1);UI.actorId=null;
  const st=startsOf();UI.t=st[UI.scene]+restLocal(P.scenes[UI.scene]);
  renderPanels();draw();
}
function renderStrip(){
  const s=$('#strip');s.textContent='';
  P.scenes.forEach((sc,i)=>s.append(el('button',{class:'chip',type:'button','aria-pressed':String(i===UI.scene),onclick:()=>selectScene(i)},el('b',{text:String(i+1)}),sc.name||'Scène')));
  s.append(el('button',{class:'chip add',type:'button',onclick:()=>{
    const ns={id:uid(),name:'Nouvelle scène',bg:curScene().bg,dur:5,lines:[],actors:[]};
    P.scenes.splice(UI.scene+1,0,ns);scheduleSave();selectScene(UI.scene+1);}},'+ Scène'));
  const cur=s.querySelector('[aria-pressed="true"]');if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest',inline:'nearest'});
}
function loadEpisode(id){
  const e=allEps().find(x=>x.id===id);if(!e)return;
  pause();EPS=allEps();
  P.eid=e.id;P.name=e.name;P.scenes=e.scenes;
  UI.scene=0;UI.actorId=null;UI.t=startsOf()[0]+restLocal(P.scenes[0]);UI.confirmDelEp=false;
  scheduleSave();renderPanels();draw();
}
function newEpisode(copyFrom){
  const id=uid(),n=EPS.length+1;
  let scenes,name;
  if(copyFrom){
    scenes=JSON.parse(JSON.stringify(P.scenes.map(s=>({...s,lines:s.lines.map(l=>({...l,audio:null})),sfx:(s.sfx||[]).map(x=>({...x,audio:null}))}))));
    const nid=o=>{o.id=uid();return o;};
    scenes.forEach(s=>{nid(s);s.lines.forEach(nid);(s.sfx||[]).forEach(nid);s.actors.forEach(a=>{nid(a);a.acts.forEach(nid);});});
    name=P.name+' (copie)';
  }else{scenes=blankScenes();name='Épisode '+n;}
  EPS=allEps();EPS.push({id,name,scenes});
  loadEpisode(id);
}
function delEpisode(){
  if(EPS.length<2)return;
  const rest=allEps().filter(e=>e.id!==P.eid);EPS=rest;
  loadEpisode(rest[0].id);
}
function renderEpbar(){
  const bar=$('#epbar');if(!bar)return;bar.textContent='';
  bar.append(selectEl(allEps().map(e=>[e.id,e.name||'Épisode']),P.eid,loadEpisode),
    el('button',{class:'btn sm',type:'button',onclick:()=>newEpisode(false)},'+ Épisode'));
}
function renderPanels(){renderEpbar();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===UI.tab)));
  $('#body').setAttribute('aria-labelledby','tab-'+UI.tab);
  renderStrip();renderBody();
}
function renderBody(){
  const b=$('#body');b.textContent='';
  ({scene:tabScene,actors:tabActors,voices:tabVoices,lib:tabLib,export:tabExport}[UI.tab])(b);
}
function numInput(val,min,max,step,onv){
  const i=el('input',{type:'number',inputmode:'decimal',step:step||.1,min,max,value:val});
  i.addEventListener('input',()=>{const v=parseFloat(i.value);if(!isNaN(v))onv(v);});
  return i;
}
function slider(label,get,set,min,max,step){
  const r=el('input',{type:'range',min,max,step,value:get()});
  const n=el('input',{type:'number',inputmode:'decimal',min,max,step,value:get()});
  r.addEventListener('input',()=>{n.value=r.value;set(+r.value);});
  n.addEventListener('input',()=>{const v=parseFloat(n.value);if(!isNaN(v)){r.value=v;set(v);}});
  return el('label',{class:'fld'},el('span',{text:label}),el('div',{class:'pair'},r,n));
}
function selectEl(opts,val,onv){
  const s=el('select');
  for(const [v,l] of opts)s.append(el('option',{value:v,text:l}));
  s.value=val;s.addEventListener('change',()=>onv(s.value));return s;
}

function moveScene(d){const i=UI.scene,j=i+d;if(j<0||j>=P.scenes.length)return;[P.scenes[i],P.scenes[j]]=[P.scenes[j],P.scenes[i]];UI.scene=j;scheduleSave();renderPanels();draw();}
function dupScene(){
  const c=JSON.parse(JSON.stringify(curScene(),(k,v)=>k==='audio'?undefined:v));
  c.id=uid();c.name+=' (copie)';c.actors.forEach(a=>{a.id=uid();a.acts.forEach(x=>x.id=uid());});c.lines.forEach(l=>{l.id=uid();l.audio=null;});(c.sfx||[]).forEach(x=>{x.id=uid();x.audio=null;});
  P.scenes.splice(UI.scene+1,0,c);scheduleSave();selectScene(UI.scene+1);
}
function delScene(){if(P.scenes.length<2)return;P.scenes.splice(UI.scene,1);UI.scene=Math.max(0,UI.scene-1);scheduleSave();selectScene(UI.scene);}

  const s=curScene(),face=isFace(id),prop=SPR[id].group==='objets';
  const a={id:uid(),spr:id,x:clamp(260+(s.actors.length%5)*190,140,W-140),y:face?H+10:(prop&&/cerf-volant/.test(id)?320:GROUND),s:face?1.3:1,flip:false,z:/cerf-volant/.test(id)?1000:0,acts:[]};
  s.actors.push(a);UI.actorId=a.id;scheduleSave();draw();setTab('actors');
}

  b.append(el('div',{class:'actors'},

      el('img',{src:SPR[x.spr]?SPR[x.spr].src:'',alt:''}),el('b',{text:SPR[x.spr]?CH[SPR[x.spr].group].name:''}),el('span',{text:SPR[x.spr]?SPR[x.spr].label.replace(/-/g,' '):x.spr}))),

    slider('Taille',()=>a.s,v=>{a.s=v;changed(true);},.2,3,.05),
    el('div',{class:'grid2'},
      el('label',{class:'fld'},el('span',{text:'Plan'}),selectEl([['-1000','Derrière'],['0','Normal'],['1000','Devant']],String(a.z>500?1000:a.z<-50?-1000:0),v=>{a.z=+v;changed(true);})),
      el('label',{class:'fld'},el('span',{text:'Miroir'}),selectEl([['0','Non'],['1','Oui']],a.flip?'1':'0',v=>{a.flip=v==='1';changed(true);}))),
    el('div',{class:'row'},
      el('button',{class:'btn sm',type:'button',onclick:()=>{const c=JSON.parse(JSON.stringify(a));c.id=uid();c.x=clamp(a.x+90,0,W);c.acts.forEach(x=>x.id=uid());s.actors.push(c);UI.actorId=c.id;scheduleSave();draw();renderBody();}},'Dupliquer'),

    el('h3',{text:'Actions'}),
    el('p',{class:'hint',text:'Chaque action démarre à un instant de la scène (en secondes) et dure un certain temps.'})
  );

function actionCard(a,c){
  const def=ACT[c.type]||ACT.walk;
  const g=SPR[a.spr]?SPR[a.spr].group:'renard';
  const poses=Object.keys(SPR).filter(k=>SPR[k].group===g).map(k=>[k,SPR[k].label.replace(/-/g,' ')]);
  const params=[];
  for(const p of def.params){
    if(p==='x')params.push(el('label',{class:'fld'},el('span',{text:'Vers x'}),numInput(c.x??a.x,-300,W+300,10,v=>{c.x=v;changed(true);})));
    if(p==='y')params.push(el('label',{class:'fld'},el('span',{text:'Vers y'}),numInput(c.y??a.y,-100,H+200,10,v=>{c.y=v;changed(true);})));
    if(p==='h')params.push(el('label',{class:'fld'},el('span',{text:'Hauteur'}),numInput(c.h??120,10,500,10,v=>{c.h=v;changed(true);})));
    if(p==='s')params.push(el('label',{class:'fld'},el('span',{text:'Taille finale'}),numInput(c.s??1.4,.2,4,.1,v=>{c.s=v;changed(true);})));
    if(p==='side')params.push(el('label',{class:'fld'},el('span',{text:'Côté'}),selectEl([['left','Gauche'],['right','Droite']],c.side||'left',v=>{c.side=v;changed(true);})));
    if(p==='expr')params.push(el('label',{class:'fld'},el('span',{text:'Expression'}),selectEl([['neutre','Neutre (celle de la pose)'],...exprsOf(g)],c.expr||'neutre',v=>{c.expr=v;changed(true);})));
    if(p==='spr')params.push(el('label',{class:'fld'},el('span',{text:'Nouvelle pose'}),selectEl(poses,c.spr||a.spr,v=>{c.spr=v;changed(true);})));
  }
  return el('div',{class:'card'},
    el('div',{class:'grid3'},
      el('label',{class:'fld'},el('span',{text:'Action'}),selectEl(Object.keys(ACT).map(k=>[k,ACT[k].label]),c.type,v=>{
        c.type=v;const nd=ACT[v];
        if(nd.params.includes('x')&&c.x==null)c.x=Math.round(a.x+250);
        if(nd.params.includes('y')&&c.y==null)c.y=a.y;
        if(nd.params.includes('h')&&c.h==null)c.h=120;
        if(nd.params.includes('s')&&c.s==null)c.s=1.4;
        if(nd.params.includes('side')&&!c.side)c.side='left';
        if(nd.params.includes('spr')&&!c.spr)c.spr=a.spr;
        if(nd.params.includes('expr')&&!c.expr){const e=exprsOf(g);c.expr=e.length?e[0][0]:'neutre';}
        changed(true);renderBody();})),
      el('label',{class:'fld'},el('span',{text:'Début (s)'}),numInput(c.t,0,300,.1,v=>{c.t=v;changed(true);})),
      el('label',{class:'fld'},el('span',{text:'Durée (s)'}),numInput(c.d,.1,60,.1,v=>{c.d=v;changed(true);}))),
    params.length?el('div',{class:'grid2'},params):null,
    el('div',{class:'row'},
      el('button',{class:'btn sm',type:'button',onclick:()=>{pause();const st=startsOf()[UI.scene];UI.t=st+Math.max(0,c.t-.2);draw();play(UI.t,st+Math.min(sceneDur(curScene()),c.t+c.d+.6));}},'Voir'),
      el('button',{class:'btn sm danger',type:'button',onclick:()=>{a.acts=a.acts.filter(x=>x.id!==c.id);scheduleSave();draw();renderBody();}},'Supprimer')));
}

/* ---- Onglet Voix ---- */
let audioTarget=null;
/* Voix ElevenLabs : disponibles seulement quand l'outil est hébergé avec la route /api/tts (Vercel) */
const VOICE={ok:false,list:[],busy:false,pw:''};
try{VOICE.pw=localStorage.getItem('atelier-pw')||'';}catch(e){}
const apiHeaders=()=>({'Content-Type':'application/json','x-app-password':VOICE.pw});
async function initVoices(){
  try{
    const r=await fetch('/api/tts',{headers:apiHeaders()});
    if(r.status===401){VOICE.ok=true;VOICE.locked=true;}
    else{
      if(!r.ok)throw new Error('no api');
      const j=await r.json();VOICE.list=j.voices||[];VOICE.ok=true;VOICE.locked=false;
    }
    if(UI.tab==='voices')renderBody();
  }catch(e){VOICE.ok=false;}
}
async function genLine(l,quiet){
  const vid=(P.voices||{})[l.who];
  if(!vid){toast('Choisis d\'abord une voix pour '+l.who+'.');return false;}
  if(!(l.text||'').trim())return false;
  ensureAudio();
  const r=await fetch('/api/tts',{method:'POST',headers:apiHeaders(),body:JSON.stringify({text:l.text,voiceId:vid})});
  if(r.status===401){VOICE.locked=true;renderBody();toast('Mot de passe refusé.');return false;}
  if(!r.ok){toast('ElevenLabs a refusé la demande ('+r.status+').');return false;}
  const ab=await r.arrayBuffer();
  const buf=await AC.decodeAudioData(ab.slice(0));
  l.audio={name:'ElevenLabs · '+l.who,ab,buf,dur:buf.duration};
  if(!quiet){scheduleSave();}
  return true;
}
async function genLines(lines,s){
  if(VOICE.busy)return;VOICE.busy=true;renderBody();
  let n=0;
  try{
    for(const l of lines){toast(`Voix ${n+1}/${lines.length}…`);if(await genLine(l,true))n++;}
    if(s&&n)autoTimes(s);
    scheduleSave();toast(n?`${n} voix générée${n>1?'s':''}.`:'Aucune voix générée.');
  }catch(e){toast('Erreur pendant la génération des voix.');}
  VOICE.busy=false;renderBody();draw();
}
function voiceCard(s){
  if(!VOICE.ok)return el('p',{class:'hint',text:'Génération des voix : disponible quand l\'outil est hébergé sur Vercel avec ta clé ElevenLabs. En attendant, charge des fichiers audio.'});
  if(VOICE.locked){
    const i=el('input',{type:'password',placeholder:'Mot de passe',value:VOICE.pw});
    return el('div',{class:'card'},el('label',{class:'fld'},el('span',{text:'Mot de passe de l\'outil'}),i),
      el('button',{class:'btn primary',type:'button',onclick:()=>{VOICE.pw=i.value;try{localStorage.setItem('atelier-pw',VOICE.pw);}catch(e){}initVoices();}},'Valider'));
  }
  P.voices=P.voices||{};
  const opts=[['','— choisir —'],...VOICE.list.map(v=>[v.id,v.name])];
  return el('div',{class:'card'},
    el('h3',{text:'Voix des personnages'}),
    el('div',{class:'grid2'},SPEAKERS.map(n=>el('label',{class:'fld'},el('span',{text:n}),selectEl(opts,P.voices[n]||'',v=>{P.voices[n]=v;scheduleSave();})))),
    el('div',{class:'row'},
      el('button',{class:'btn primary',type:'button',disabled:VOICE.busy,onclick:()=>genLines(s.lines,s)},VOICE.busy?'Génération…':'Générer les voix de cette scène'),
      el('button',{class:'btn',type:'button',disabled:VOICE.busy,onclick:async()=>{for(const sc of P.scenes)await genLines(sc.lines,sc);}},'Tout l\'épisode')));
}
function tabVoices(b){
  const s=curScene();
  b.append(voiceCard(s));
  b.append(el('p',{class:'hint',text:'Une réplique = une ligne de texte affichée en sous-titre, et un fichier audio facultatif (par exemple généré avec ElevenLabs).'}));
  s.lines.forEach((l,i)=>b.append(lineCard(s,l,i)));
  b.append(el('div',{class:'row'},
    el('button',{class:'btn',type:'button',onclick:()=>{
      const last=s.lines[s.lines.length-1];
      s.lines.push({id:uid(),who:last?last.who:'Roux',text:'',t:last?+(last.t+lineDur(last)+.35).toFixed(2):.7,audio:null});scheduleSave();renderBody();}},'+ Réplique'),
    el('button',{class:'btn',type:'button',onclick:()=>{autoTimes(s);scheduleSave();renderBody();draw();}},'Recalculer les temps'),
    el('button',{class:'btn',type:'button',onclick:()=>$('#fileAudioMulti').click()},'Charger plusieurs audios')));
  b.append(el('p',{class:'hint',text:'« Charger plusieurs audios » associe les fichiers aux répliques dans l\'ordre alphabétique de leurs noms (L1, L2, L3…), puis recalcule les temps.'}));
  s.sfx=s.sfx||[];
  b.append(el('h3',{text:'Bruitages de la scène'}),
    el('p',{class:'hint',text:'Un bruitage = une description en anglais (c\'est ce que comprend le mieux ElevenLabs) placée à un instant précis. Il est mixé avec les voix et inclus dans la vidéo.'}));

/* ================= Découpe des planches (navigateur) ================= */
function dilate(src,w,h,rx,ry){
  const tmp=new Uint8Array(w*h),out=new Uint8Array(w*h);
  if(rx>0){const f=new Int32Array(w);for(let y=0;y<h;y++){const o=y*w;let d=1e9;for(let x=0;x<w;x++){if(src[o+x])d=0;else d++;f[x]=d;}d=1e9;for(let x=w-1;x>=0;x--){if(src[o+x])d=0;else d++;if(Math.min(f[x],d)<=rx)tmp[o+x]=1;}}}else tmp.set(src);
  if(ry>0){const f=new Int32Array(h);for(let x=0;x<w;x++){let d=1e9;for(let y=0;y<h;y++){if(tmp[y*w+x])d=0;else d++;f[y]=d;}d=1e9;for(let y=h-1;y>=0;y--){if(tmp[y*w+x])d=0;else d++;if(Math.min(f[y],d)<=ry)out[y*w+x]=1;}}}else out.set(tmp);
  return out;
}
function labelComps(mask,w,h){
  const lab=new Int32Array(w*h),stack=new Int32Array(w*h),boxes=[];let n=0;
  for(let i=0;i<w*h;i++){
    if(!mask[i]||lab[i])continue;n++;let sp=0;stack[sp++]=i;lab[i]=n;let x0=w,y0=h,x1=0,y1=0;
    while(sp){const p=stack[--sp],x=p%w,y=(p/w)|0;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      if(x>0&&mask[p-1]&&!lab[p-1]){lab[p-1]=n;stack[sp++]=p-1;}
      if(x<w-1&&mask[p+1]&&!lab[p+1]){lab[p+1]=n;stack[sp++]=p+1;}
      if(y>0&&mask[p-w]&&!lab[p-w]){lab[p-w]=n;stack[sp++]=p-w;}
      if(y<h-1&&mask[p+w]&&!lab[p+w]){lab[p+w]=n;stack[sp++]=p+w;}}
    boxes.push({x0,y0,x1:x1+1,y1:y1+1});
  }
  return{lab,boxes};
}
function readingOrder(boxes){
  const hs=boxes.map(b=>b.y1-b.y0).sort((a,b)=>a-b),med=hs[hs.length>>1]||100;
  const rows=[];
  for(const b of boxes.slice().sort((a,c)=>(a.y0+a.y1)-(c.y0+c.y1))){
    const cy=(b.y0+b.y1)/2,r=rows.find(r=>Math.abs(r.cy-cy)<med*.5);
    if(r){r.items.push(b);r.cy=(r.cy*(r.items.length-1)+cy)/r.items.length;}else rows.push({cy,items:[b]});
  }
  rows.sort((a,b)=>a.cy-b.cy);return rows.flatMap(r=>r.items.sort((a,b)=>a.x0-b.x0));
}
function sliceSheet(img){
  let sw=img.naturalWidth,sh=img.naturalHeight;const k=Math.min(1,1600/sw);sw=Math.round(sw*k);sh=Math.round(sh*k);
  const c=document.createElement('canvas');c.width=sw;c.height=sh;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,sw,sh);
  const d=x.getImageData(0,0,sw,sh).data,n=sw*sh;
  let hasAlpha=false;for(let i=3;i<d.length;i+=4*97)if(d[i]<200){hasAlpha=true;break;}
  const fg=new Uint8Array(n);
  for(let i=0;i<n;i++){const j=i*4;fg[i]=hasAlpha?(d[j+3]>24?1:0):((d[j+3]>200&&Math.min(d[j],d[j+1],d[j+2])<225)?1:0);}
  let texts=new Uint8Array(n);
  if(!hasAlpha){
    const wide=labelComps(dilate(fg,sw,sh,6,0),sw,sh);
    const isText=wide.boxes.map(b=>(b.y1-b.y0)<=36&&(b.x1-b.x0)<=360);
    for(let i=0;i<n;i++){if(fg[i]&&wide.lab[i]&&isText[wide.lab[i]-1])texts[i]=1;}
  }
  const fg2=new Uint8Array(n);for(let i=0;i<n;i++)fg2[i]=fg[i]&&!texts[i]?1:0;
  let {boxes}=labelComps(dilate(fg2,sw,sh,2,2),sw,sh);
  let big=boxes.filter(b=>b.y1-b.y0>=70);const small=boxes.filter(b=>b.y1-b.y0<70);
  if(!big.length){big=boxes.filter(b=>b.y1-b.y0>=20&&b.x1-b.x0>=20);if(!big.length)return[];}
  else for(const s of small){
    let best=null,bd=1e9;
    for(const b of big){const dx=Math.max(b.x0-s.x1,s.x0-b.x1,0),dy=Math.max(b.y0-s.y1,s.y0-b.y1,0),dd=Math.hypot(dx,dy);if(dd<bd){bd=dd;best=b;}}
    if(best&&bd<40){best.x0=Math.min(best.x0,s.x0);best.y0=Math.min(best.y0,s.y0);best.x1=Math.max(best.x1,s.x1);best.y1=Math.max(best.y1,s.y1);}
  }
  const tD=dilate(texts,sw,sh,1,1);
  return readingOrder(big).map(b=>cutSprite(c,d,sw,b,tD,hasAlpha));
}
function cutSprite(c,d,sw,box,tD,hasAlpha){
  const pad=6,bw=box.x1-box.x0,bh=box.y1-box.y0,W2=bw+pad*2,H2=bh+pad*2;
  const oc=document.createElement('canvas');oc.width=W2;oc.height=H2;
  const ox=oc.getContext('2d',{willReadFrequently:true});
  if(!hasAlpha){ox.fillStyle='#fff';ox.fillRect(0,0,W2,H2);}
  ox.drawImage(c,box.x0,box.y0,bw,bh,pad,pad,bw,bh);
  const id=ox.getImageData(0,0,W2,H2),o=id.data;
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){
    if(tD[(box.y0+y)*sw+box.x0+x]){const j=((y+pad)*W2+x+pad)*4;if(hasAlpha)o[j+3]=0;else{o[j]=o[j+1]=o[j+2]=255;o[j+3]=255;}}
  }
  if(!hasAlpha){
    const white=new Uint8Array(W2*H2);
    for(let i=0;i<W2*H2;i++){const j=i*4;white[i]=Math.min(o[j],o[j+1],o[j+2])>228?1:0;}
    const bg=new Uint8Array(W2*H2),st=new Int32Array(W2*H2);let sp=0;
    const push=p=>{if(white[p]&&!bg[p]){bg[p]=1;st[sp++]=p;}};
    for(let x=0;x<W2;x++){push(x);push((H2-1)*W2+x);}for(let y=0;y<H2;y++){push(y*W2);push(y*W2+W2-1);}
    while(sp){const p=st[--sp],x=p%W2,y=(p/W2)|0;if(x>0)push(p-1);if(x<W2-1)push(p+1);if(y>0)push(p-W2);if(y<H2-1)push(p+W2);}
    const near=dilate(bg,W2,H2,2,2);
    for(let i=0;i<W2*H2;i++){
      const j=i*4;let a=255;
      if(bg[i])a=0;else if(near[i]){const m=Math.min(o[j],o[j+1],o[j+2]);a=Math.round(clamp(clamp((250-m)/65,0,1)*1.15,0,1)*255);}
      o[j+3]=a;
    }
  }
  ox.putImageData(id,0,0);
  let x0=W2,y0=H2,x1=0,y1=0;
  for(let y=0;y<H2;y++)for(let x=0;x<W2;x++)if(o[(y*W2+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<x0)return null;
  const fw=x1-x0+1,fh=y1-y0+1,sc=Math.min(1,420/fh),rc=document.createElement('canvas');
  rc.width=Math.max(1,Math.round(fw*sc));rc.height=Math.max(1,Math.round(fh*sc));
  rc.getContext('2d').drawImage(oc,x0,y0,fw,fh,0,0,rc.width,rc.height);
  return{src:rc.toDataURL('image/png'),w:rc.width,h:rc.height};
}

async function exportVideo(sceneOnly){
  if(UI.rec)return;pause();
  const mime=pickMime();if(!mime){toast('Format vidéo non pris en charge.');return;}
  ensureAudio();
  let dest=null,keep=null;
  try{
    await AC.resume();dest=AC.createMediaStreamDestination();
    keep=AC.createConstantSource();keep.offset.value=0;keep.connect(dest);keep.start();
  }catch(e){dest=null;}
  const stream=cv.captureStream(30);
  if(dest)dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const st=startsOf();
  const from=sceneOnly?st[UI.scene]:0,to=sceneOnly?st[UI.scene]+sceneDur(curScene()):totalDur();
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6e6}),chunks=[];
  rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data);};
  UI.rec={cancel:false};renderBody();
  const finished=new Promise(res=>{rec.onstop=res;});
  UI.onEnd=()=>{UI.onEnd=null;try{rec.stop();}catch(e){}};
  const bar=()=>{const el2=$('#recbar');if(el2)el2.style.width=Math.round(clamp((UI.t-from)/Math.max(.1,to-from),0,1)*100)+'%';};
  const iv=setInterval(()=>{bar();if(UI.rec&&UI.rec.cancel){clearInterval(iv);UI.onEnd=null;try{rec.stop();}catch(e){}}},200);
  toast('Enregistrement en cours…');
  rec.start(500);
  play(from,to,dest);
  await finished;clearInterval(iv);
  try{if(keep)keep.stop();}catch(e){}
  const cancelled=UI.rec&&UI.rec.cancel;UI.rec=null;UI.onEnd=null;
  if(cancelled||!chunks.length){toast('Export annulé.');renderBody();return;}
  const ext=mime.startsWith('video/mp4')?'mp4':'webm';
  const blob=new Blob(chunks,{type:mime.split(';')[0]});
  renderBody();
  await saveBlob(blob,(sceneOnly?'scene-'+(UI.scene+1):'episode')+'.'+ext);
}

/* ================= Glisser un acteur sur la scène ================= */
let drag=null;
function toStage(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{
  if(UI.playing)return;
  const p=toStage(e),s=curScene(),{lt}=locate(UI.t);
  const order=stageOrder(s).reverse();
  for(const a of order){
    const st=stateAt(a,lt),b=actorBox(st);if(!b||st.alpha<=0)continue;
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){
      UI.actorId=a.id;drag={a,x:p.x,y:p.y};cv.setPointerCapture(e.pointerId);cv.classList.add('drag');
      if(UI.tab==='actors')renderBody();else setTab('actors');
      e.preventDefault();return;
    }
  }
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;const p=toStage(e);
  drag.a.x=Math.round(drag.a.x+p.x-drag.x);drag.a.y=Math.round(drag.a.y+p.y-drag.y);drag.x=p.x;drag.y=p.y;draw();
});
const endDrag=()=>{if(!drag)return;drag=null;cv.classList.remove('drag');scheduleSave();if(UI.tab==='actors')renderBody();};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

/* ================= Démarrage ================= */
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
$('#btnPlay').addEventListener('click',()=>{if(UI.playing)pause();else play();});
$('#btnRestart').addEventListener('click',()=>{pause();seek(0);});
$('#btnTopExport').addEventListener('click',()=>{setTab('export');$('#body').scrollIntoView({behavior:'smooth',block:'start'});});
$('#scrub').addEventListener('input',e=>{if(UI.playing)pause();seek(+e.target.value/1000*totalDur());});
setPlayIcon();
const fontsReady=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('600 36px "Baloo 2"'),document.fonts.load('400 16px Nunito')]).catch(()=>{}):Promise.resolve();
(async()=>{
  await restore();seedEpisodes();scheduleSave();initVoices();
  UI.scene=0;UI.t=startsOf()[0]+restLocal(P.scenes[0]);
  renderPanels();draw();
  fontsReady.then(()=>draw());
})();
})();
</script>
